[network]
build_flags =
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192
    -DSSE_MAX_QUEUED_MESSAGES=8

[ble]
build_flags =
    -include include/nimble_config.h

[env:m5stamp-pico]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = m5stamp-pico
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes
upload_speed = 921600
extra_scripts =
    pre:generate_build_info.py
    pre:generate_web_ui.py
    post:provision.py

lib_deps =
    h2zero/NimBLE-Arduino
    https://github.com/ESP32Async/ESPAsyncWebServer
    bblanchon/ArduinoJson@7.4.3

lib_ignore =
    libsmb2
    SD_MMC

board_build.partitions = partitions.csv

board_build.arduino.loop_stack_size = 8192

build_flags =
    ${network.build_flags}
    ${ble.build_flags}

build_src_filter =
    +<*>
    -<migrate_main.cpp>
    -<migrate.cpp>
    -<hex_util.cpp>
    -<json_util.cpp>
    -<large_text_buffer.cpp>
    -<sleephq_client.cpp>
    -<sleephq_protocol.cpp>
    -<sleephq_sync.cpp>
    -<storage_smb_client.cpp>
    -<string_util.cpp>

[env:ota]
extends = env:m5stamp-pico
upload_protocol = espota
upload_port = airbridge
upload_flags = --auth=${sysenv.AIRBRIDGE_OTA_PASS}

[env:migrate]
extends = env:m5stamp-pico
board_build.partitions = partitions_v1.csv
extra_scripts =
    pre:generate_build_info.py
    pre:generate_target_ptable.py
    post:provision.py
build_flags =
    -DFIRMWARE_MIGRATE=1
build_src_filter =
    +<migrate_main.cpp>
    +<build_info.cpp>
    +<app_config.cpp>
    +<debug_log.cpp>
    +<uart_arbiter.cpp>
    +<qframe.cpp>
    +<crc.cpp>
    +<wifi.cpp>
    +<network_hints.cpp>
    +<live_stream.cpp>
    +<migrate_ota.cpp>
    +<migrate.cpp>

[env:migrate-ota]
extends = env:migrate
upload_protocol = espota
upload_port = airbridge
upload_flags = --auth=${sysenv.AIRBRIDGE_OTA_PASS}

[env:xiao-esp32s3-plus]
extends = env:m5stamp-pico
board = seeed_xiao_esp32s3
board_build.variant = XIAO_ESP32S3_Plus
board_build.partitions = partitions_s3_8mb.csv
build_flags =
    ${network.build_flags}
    ${ble.build_flags}
    -DAB_BOARD_XIAO_ESP32S3_PLUS=1
    -DAB_AS10_TX_GPIO=1
    -DAB_AS10_RX_GPIO=2
    -DAB_LED_GPIO=21

[env:xiao-esp32s3-plus-sdmmc4]
extends = env:xiao-esp32s3-plus
lib_ignore =
lib_deps =
    ${env:m5stamp-pico.lib_deps}
build_src_filter =
    ${env:m5stamp-pico.build_src_filter}
    +<hex_util.cpp>
    +<json_util.cpp>
    +<large_text_buffer.cpp>
    +<sleephq_client.cpp>
    +<sleephq_protocol.cpp>
    +<sleephq_sync.cpp>
    +<storage_smb_client.cpp>
    +<string_util.cpp>
build_flags =
    ${env:xiao-esp32s3-plus.build_flags}
    -DAB_STORAGE_SDMMC_ENABLED=1
    -DAB_SDMMC_WIDTH=4
    -DAB_SDMMC_CLK_GPIO=13
    -DAB_SDMMC_CMD_GPIO=11
    -DAB_SDMMC_D0_GPIO=12
    -DAB_SDMMC_D1_GPIO=38
    -DAB_SDMMC_D2_GPIO=39
    -DAB_SDMMC_D3_GPIO=40
    -DAB_SDMMC_FREQ_KHZ=40000

[env:xiao-esp32s3-plus-sdmmc4-ota]
extends = env:xiao-esp32s3-plus-sdmmc4
upload_protocol = espota
upload_port = airbridge
upload_flags = --auth=${sysenv.AIRBRIDGE_OTA_PASS}

; AirBridge PCB rev D.1: ESP32-S3-WROOM-1U-N16R8, native USB, 4-bit SD.
[env:wroom-s3-n16r8-sdmmc4]
extends = env:xiao-esp32s3-plus-sdmmc4
board = esp32-s3-devkitc-1
board_build.variant = esp32s3
upload_protocol = esptool
board_upload.before_reset = usb-reset
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_s3_16mb.csv
build_flags =
    ${env:m5stamp-pico.build_flags}
    -DAB_BOARD_WROOM_S3=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DAB_AS10_TX_GPIO=1
    -DAB_AS10_RX_GPIO=2
    -DAB_LED_GPIO=21
    -DAB_STORAGE_SDMMC_ENABLED=1
    -DAB_SDMMC_WIDTH=4
    -DAB_SDMMC_CLK_GPIO=13
    -DAB_SDMMC_CMD_GPIO=11
    -DAB_SDMMC_D0_GPIO=12
    -DAB_SDMMC_D1_GPIO=38
    -DAB_SDMMC_D2_GPIO=39
    -DAB_SDMMC_D3_GPIO=40
    -DAB_SDMMC_FREQ_KHZ=40000

[env:wroom-s3-n16r8-sdmmc4-ota]
extends = env:wroom-s3-n16r8-sdmmc4
upload_protocol = espota
upload_port = airbridge
upload_flags = --auth=${sysenv.AIRBRIDGE_OTA_PASS}
