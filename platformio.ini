[network]
build_flags =
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192
    -DSSE_MAX_QUEUED_MESSAGES=8

[ble]
build_flags =
    -include include/nimble_config.h

[esp32s3]
build_flags =
    -Wl,--wrap=xTaskCreatePinnedToCore

[env:m5stamp-pico]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = m5stamp-pico
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes
upload_speed = 921600
extra_scripts =
    pre:python/tools/extend_asyncwebserver.py
    pre:generate_build_info.py
    pre:generate_web_ui.py
    post:python/tools/generate_initial_image.py
    post:python/tools/configure_build_cache.py
    post:provision.py

lib_deps =
    h2zero/NimBLE-Arduino@2.5.1
    ESP32Async/ESPAsyncWebServer@3.12.1
    ESP32Async/AsyncTCP@3.5.0
    bblanchon/ArduinoJson@7.4.3

lib_ignore =
    libsmb2
    SD_MMC

board_build.partitions = partitions.csv

board_build.arduino.loop_stack_size = 8192

build_flags =
    ${network.build_flags}
    ${ble.build_flags}

build_src_filter =
    +<*>
    -<hex_util.cpp>
    -<json_util.cpp>
    -<large_text_buffer.cpp>
    -<sleephq_client.cpp>
    -<sleephq_protocol.cpp>
    -<sleephq_sync.cpp>
    -<storage_smb_client.cpp>

[env:xiao-esp32s3-plus]
extends = env:m5stamp-pico
board = seeed_xiao_esp32s3
board_build.variant = XIAO_ESP32S3_Plus
board_build.partitions = partitions_s3_8mb.csv
build_flags =
    ${network.build_flags}
    ${ble.build_flags}
    ${esp32s3.build_flags}
    -DAB_BOARD_XIAO_ESP32S3_PLUS=1
    -DAB_AS10_TX_GPIO=1
    -DAB_AS10_RX_GPIO=2
    -DAB_LED_GPIO=21

[env:xiao-esp32s3-plus-sdmmc4]
extends = env:xiao-esp32s3-plus
lib_ignore =
lib_deps =
    ${env:m5stamp-pico.lib_deps}
build_src_filter =
    ${env:m5stamp-pico.build_src_filter}
    +<hex_util.cpp>
    +<json_util.cpp>
    +<large_text_buffer.cpp>
    +<sleephq_client.cpp>
    +<sleephq_protocol.cpp>
    +<sleephq_sync.cpp>
    +<storage_smb_client.cpp>
build_flags =
    ${env:xiao-esp32s3-plus.build_flags}
    -DAB_STORAGE_SDMMC_ENABLED=1
    -DAB_SDMMC_WIDTH=4
    -DAB_SDMMC_CLK_GPIO=13
    -DAB_SDMMC_CMD_GPIO=11
    -DAB_SDMMC_D0_GPIO=12
    -DAB_SDMMC_D1_GPIO=38
    -DAB_SDMMC_D2_GPIO=39
    -DAB_SDMMC_D3_GPIO=40
    -DAB_SDMMC_FREQ_KHZ=40000

; Waveshare ESP32-S3-GEEK: 16 MB flash, 2 MB QSPI PSRAM, onboard SD.
[env:waveshare-esp32-s3-geek]
extends = env:xiao-esp32s3-plus-sdmmc4
board = esp32-s3-devkitc-1
board_build.variant = esp32s3
upload_protocol = esptool
board_upload.before_reset = usb-reset
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_s3_16mb.csv
build_flags =
    ${env:m5stamp-pico.build_flags}
    ${esp32s3.build_flags}
    -DAB_BOARD_WAVESHARE_ESP32_S3_GEEK=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DAB_AS10_TX_GPIO=43
    -DAB_AS10_RX_GPIO=44
    -DAB_LED_GPIO=-1
    -DAB_LCD_BACKLIGHT_GPIO=7
    -DAB_STORAGE_SDMMC_ENABLED=1
    -DAB_SDMMC_WIDTH=4
    -DAB_SDMMC_CLK_GPIO=36
    -DAB_SDMMC_CMD_GPIO=35
    -DAB_SDMMC_D0_GPIO=37
    -DAB_SDMMC_D1_GPIO=33
    -DAB_SDMMC_D2_GPIO=38
    -DAB_SDMMC_D3_GPIO=34
    -DAB_SDMMC_FREQ_KHZ=40000

; AirBridge PCB rev D.1: ESP32-S3-WROOM-1U-N16R8, native USB, 4-bit SD.
[env:wroom-s3-n16r8-sdmmc4]
extends = env:xiao-esp32s3-plus-sdmmc4
board = esp32-s3-devkitc-1
board_build.variant = esp32s3
upload_protocol = esptool
board_upload.before_reset = usb-reset
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_s3_16mb.csv
build_flags =
    ${env:m5stamp-pico.build_flags}
    ${esp32s3.build_flags}
    -DAB_BOARD_WROOM_S3=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DAB_AS10_TX_GPIO=1
    -DAB_AS10_RX_GPIO=2
    -DAB_LED_GPIO=21
    -DAB_STORAGE_SDMMC_ENABLED=1
    -DAB_SDMMC_WIDTH=4
    -DAB_SDMMC_CLK_GPIO=13
    -DAB_SDMMC_CMD_GPIO=11
    -DAB_SDMMC_D0_GPIO=12
    -DAB_SDMMC_D1_GPIO=38
    -DAB_SDMMC_D2_GPIO=39
    -DAB_SDMMC_D3_GPIO=40
    -DAB_SDMMC_FREQ_KHZ=40000

; Waveshare ESP32-S3-LCD-1.54: ESP32-S3R8 (16 MB QIO flash, 8 MB octal PSRAM),
; ST7789 240x240 status screen, onboard 4-bit TF slot. Board-wide flags shared
; by both AirSense wiring variants below; the UART pins are set per variant.
[waveshare_s3_lcd154]
build_flags =
    ${env:m5stamp-pico.build_flags}
    ${esp32s3.build_flags}
    -DAB_BOARD_WAVESHARE_S3_LCD154=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DAB_LED_GPIO=-1
    -DAB_LCD_ENABLED=1
    -DAB_LCD_MOSI_GPIO=39
    -DAB_LCD_SCLK_GPIO=38
    -DAB_LCD_CS_GPIO=21
    -DAB_LCD_DC_GPIO=45
    -DAB_LCD_RST_GPIO=40
    -DAB_LCD_BL_GPIO=46
    -DAB_BTN1_GPIO=0
    -DAB_BTN2_GPIO=4
    -DAB_BTN3_GPIO=5
    -DAB_POWER_HOLD_GPIO=2
    -DAB_STORAGE_SDMMC_ENABLED=1
    -DAB_SDMMC_WIDTH=4
    -DAB_SDMMC_CLK_GPIO=16
    -DAB_SDMMC_CMD_GPIO=15
    -DAB_SDMMC_D0_GPIO=17
    -DAB_SDMMC_D1_GPIO=18
    -DAB_SDMMC_D2_GPIO=13
    -DAB_SDMMC_D3_GPIO=14
    -DAB_SDMMC_FREQ_KHZ=20000

; Standard wiring: AirSense UART on the exposed ESP_TXD/ESP_RXD pads
; (GPIO43/44, UART0 pins), so the console MUST run over native USB CDC to
; keep logs off the AirSense line.
[env:waveshare-s3-lcd154]
extends = env:xiao-esp32s3-plus-sdmmc4
board = esp32-s3-devkitc-1
board_build.variant = esp32s3
upload_protocol = esptool
board_upload.before_reset = usb-reset
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_s3_16mb.csv
lib_deps =
    ${env:xiao-esp32s3-plus-sdmmc4.lib_deps}
    moononournation/GFX Library for Arduino@^1.6.0
build_flags =
    ${waveshare_s3_lcd154.build_flags}
    -DAB_AS10_TX_GPIO=43
    -DAB_AS10_RX_GPIO=44

; Alternate wiring for boards whose ESP_TXD/ESP_RXD pads are damaged: AirSense
; UART on the SCL/SDA pads. These are the on-board I2C bus (IMU, audio codecs,
; touch controller, 4.7k pull-ups), which the firmware never uses.
;   AirSense Tx -> SCL pad (GPIO41, AirBridge RX). I2C chips never drive SCL.
;   AirSense Rx <- SDA pad (GPIO42, AirBridge TX), driven open-drain so an I2C
;   chip pulling SDA low for an ACK can't fight the output.
; The touch controller (touch variant) is held in reset to take it off the bus.
[env:waveshare-s3-lcd154-i2cpads]
extends = env:waveshare-s3-lcd154
build_flags =
    ${waveshare_s3_lcd154.build_flags}
    -DAB_AS10_TX_GPIO=42
    -DAB_AS10_RX_GPIO=41
    -DAB_AS10_TX_OPEN_DRAIN=1
    -DAB_TOUCH_RST_GPIO=47
