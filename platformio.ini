[env:m5stamp-pico]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = m5stamp-pico
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes
upload_speed = 921600
extra_scripts =
    pre:generate_web_ui.py
    post:provision.py

lib_deps =
    h2zero/NimBLE-Arduino
    https://github.com/ESP32Async/ESPAsyncWebServer

board_build.partitions = partitions.csv

board_build.arduino.loop_stack_size = 8192

build_flags =
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER=0
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL=0
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL=1
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_MAX_BONDS=3

build_src_filter =
    +<*>
    -<migrate_main.cpp>
    -<migrate.cpp>

build_src_flags =
    !bash version.sh

[env:ota]
extends = env:m5stamp-pico
upload_protocol = espota
upload_port = airbridge
upload_flags = --auth=${sysenv.AIRBRIDGE_OTA_PASS}

[env:migrate]
extends = env:m5stamp-pico
board_build.partitions = partitions_v1.csv
extra_scripts =
    pre:generate_target_ptable.py
    post:provision.py
build_flags =
    -DFIRMWARE_MIGRATE=1
build_src_filter =
    +<migrate_main.cpp>
    +<app_config.cpp>
    +<debug_log.cpp>
    +<uart_arbiter.cpp>
    +<qframe.cpp>
    +<crc.cpp>
    +<wifi.cpp>
    +<network_hints.cpp>
    +<live_stream.cpp>
    +<airbridge_ota.cpp>
    +<migrate.cpp>

[env:migrate-ota]
extends = env:migrate
upload_protocol = espota
upload_port = airbridge
upload_flags = --auth=${sysenv.AIRBRIDGE_OTA_PASS}

[env:xiao-esp32s3-plus]
extends = env:m5stamp-pico
board = seeed_xiao_esp32s3
board_build.variant = XIAO_ESP32S3_Plus
board_build.partitions = partitions_s3_8mb.csv
build_flags =
    -DAB_BOARD_XIAO_ESP32S3_PLUS=1
    -DAB_AS10_TX_GPIO=1
    -DAB_AS10_RX_GPIO=2
    -DAB_LED_GPIO=21

[env:xiao-esp32s3-plus-sdmmc4]
extends = env:xiao-esp32s3-plus
build_flags =
    ${env:xiao-esp32s3-plus.build_flags}
    -DAB_STORAGE_SDMMC_ENABLED=1
    -DAB_SDMMC_WIDTH=4
    -DAB_SDMMC_CLK_GPIO=13
    -DAB_SDMMC_CMD_GPIO=11
    -DAB_SDMMC_D0_GPIO=12
    -DAB_SDMMC_D1_GPIO=38
    -DAB_SDMMC_D2_GPIO=39
    -DAB_SDMMC_D3_GPIO=40
    -DAB_SDMMC_FREQ_KHZ=40000

[env:xiao-esp32s3-plus-sdmmc4-ota]
extends = env:xiao-esp32s3-plus-sdmmc4
upload_protocol = espota
upload_port = airbridge
upload_flags = --auth=${sysenv.AIRBRIDGE_OTA_PASS}

; Waveshare ESP32-S3-LCD-1.54 (ESP32-S3R8: 16MB QIO flash, 8MB octal PSRAM).
; AirSense UART uses the exposed ESP_TXD/ESP_RXD pads (GPIO43/44, UART0 pins),
; so the console MUST run over native USB CDC to keep logs off the AirSense line.
[env:waveshare-s3-lcd154]
extends = env:m5stamp-pico
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_s3_8mb.csv
build_flags =
    ${env:m5stamp-pico.build_flags}
    -DAB_BOARD_WAVESHARE_S3_LCD154=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DAB_AS10_TX_GPIO=43
    -DAB_AS10_RX_GPIO=44
    -DAB_LED_GPIO=-1
    -DAB_LCD_BL_GPIO=46
    -DAB_POWER_HOLD_GPIO=2

[env:waveshare-s3-lcd154-ota]
extends = env:waveshare-s3-lcd154
upload_protocol = espota
upload_port = airbridge
upload_flags = --auth=${sysenv.AIRBRIDGE_OTA_PASS}
